name: iOS Objective-C

on:
  pull_request:
    types: [opened, reopened, unlocked, synchronize]

jobs:
  Tests:
    runs-on: macos-latest

    env:
      project-path: ./Example

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Cocoapods cache
        uses: actions/cache@v4
        id: cocoapods-cache
        with:
          path: ${{ env.project-path }}/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles(format('{0}/{1}', env.project-path, 'Podfile.lock')) }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install iOS project dependencies
        if: steps.cocoapods-cache.outputs.cache-hit != 'true'
        run: pod install
        working-directory: ${{ env.project-path }}

      - name: Test
        run: |
          set -o pipefail
          DESTINATION_ID="$(xcodebuild -workspace AvoStateOfTracking.xcworkspace -scheme AvoStateOfTracking-Example -showdestinations 2>/dev/null | grep 'id:' | grep -v 'placeholder' | sed -E 's/.*id:[[:space:]]*([^,}]+).*/\1/' | sed -E 's/[[:space:]]+//g' | head -n1)"
          if [ -z "$DESTINATION_ID" ]; then
            echo "No valid destination id found for scheme AvoStateOfTracking-Example"
            xcodebuild -workspace AvoStateOfTracking.xcworkspace -scheme AvoStateOfTracking-Example -showdestinations
            exit 1
          fi
          echo "Using destination id: $DESTINATION_ID"
          xcodebuild -workspace AvoStateOfTracking.xcworkspace -scheme AvoStateOfTracking-Example -destination "id=$DESTINATION_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" clean test | xcpretty
        working-directory: ${{ env.project-path }}
